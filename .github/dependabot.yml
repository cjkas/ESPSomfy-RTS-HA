# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# Each ecosystem waits a week after a release (cooldown), so a hijacked
# release has time to be caught before it lands here.
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The workflows' actions are pinned to commit SHAs; this moves the pins.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The test requirements. The integration itself has none.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Each release pins a Home Assistant and its Python (3.14 by
      # 0.13.375), and tests.yaml runs 3.13: bump it by hand, with both.
      - dependency-name: "pytest-homeassistant-custom-component"
